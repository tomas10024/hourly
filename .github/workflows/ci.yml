name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://valandine:valandine@localhost:5432/valandine_test
  JWT_ACCESS_SECRET: ci-access-secret-0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
  WEB_ORIGIN: http://localhost:3000

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valandine
          POSTGRES_PASSWORD: valandine
          POSTGRES_DB: valandine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valandine -d valandine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace packages/shared

      - name: Apply database migrations
        run: npm run db:deploy --workspace apps/api

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Tests
        run: npm run test --workspaces --if-present

      # The committed specification must match the code it is generated from.
      - name: Check the exported OpenAPI document is current
        run: |
          npm run openapi:export
          git diff --exit-code docs/openapi.json

      - name: Build
        run: |
          npm run build --workspace apps/api
          npm run build --workspace apps/web

      - name: Seed demo data
        run: npm run db:seed

      # The Postman collection doubles as an integration test: it drives a full
      # project lifecycle against a real server and cleans up after itself.
      - name: Run API demo collection
        run: |
          npm run start --workspace apps/api &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health > /dev/null && break
            sleep 1
          done
          npm run demo
