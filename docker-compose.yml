services:
  db:
    image: postgres:17-alpine
    container_name: valandine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: valandine
      POSTGRES_PASSWORD: valandine
      POSTGRES_DB: valandine
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valandine -d valandine']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
