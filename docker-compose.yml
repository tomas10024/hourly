services:
  db:
    image: postgres:17-alpine
    container_name: hourly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hourly
      POSTGRES_PASSWORD: hourly
      POSTGRES_DB: hourly
    ports:
      # Host port 5433: 5432 is often taken by another local postgres.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hourly -d hourly']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
