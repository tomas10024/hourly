  /sessions:
    get:
      tags:
        - Work sessions
      summary: My work log across projects
      description: "A personal view, not a second address: the sessions of the actor. `projectId` and `taskId` narrow it, `from`/`to` select by start time (`from <= startedAt < to`), `running=true` finds the timer still going. `projectId` and `taskId` of each entry give its address under `/projects/{projectId}/tasks/{taskId}/sessions`."
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - in: query
          name: perPage
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: projectId
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
