                additionalProperties: false
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many attempts; try again later
                  details:
                    retryAfterSeconds: 900
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in
      description: An unknown e-mail and a wrong password get the same 401. A blocked account gets 403 only after its password has been verified. Ten failed attempts for one e-mail from one address within 15 minutes are answered 429 until the window passes; successful sign-ins are not counted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  example: specialistas@hourly.lt
                password:
                  type: string
                  minLength: 1
                  example: slaptazodis123
              required:
                - email
                - password
            example:
              email: demo-1793554501506@example.lt
              password: slaptazodis123
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              required: true
              description: The refresh token (httpOnly)
              schema:
                type: string
                description: The refresh token (httpOnly)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      displayName:
                        type: string
                      role:
                        type: string
                        enum:
                          - CLIENT
                          - SPECIALIST
                          - ADMIN
                      bio:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        example: 2026-09-24T09:00:00.000Z
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                        example: specialistas@hourly.lt
                      isBlocked:
                        type: boolean
                    required:
                      - id
                      - displayName
                      - role
                      - bio
                      - createdAt
                      - email
                      - isBlocked
                    additionalProperties: false
                required:
                  - accessToken
                  - user
                additionalProperties: false
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiU1BFQ0lBTElTVCIsInNpZCI6IjQxMWE3NTkwLTMxMTItNDVhMi04OGJjLTVkM2UwODFiOTAwMiIsImlhdCI6MTc5MzU1NDUwMiwiZXhwIjoxNzkzNTU1NDAyLCJhdWQiOiJob3VybHkiLCJpc3MiOiJob3VybHktYXBpIiwic3ViIjoiMTMyNTgwNTItZDE2ZC00MTEyLTgxM2QtMjUzZDQ1M2I3MmQ3In0.<signature>
                user:
                  id: 13258052-d16d-4112-813d-253d453b72d7
                  displayName: Demonstracinis specialistas
                  role: SPECIALIST
                  bio: null
                  createdAt: 2026-11-01T17:35:02.029Z
                  email: demo-1793554501506@example.lt
                  isBlocked: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
