    get:
      tags:
        - Work sessions
      summary: Work sessions of a task (project -> task -> sessions)
      description: The whole hierarchy in one address. A missing project, or a task that does not belong to it, answers 404 - not an empty list. Logged hours are readable by the parties of the project and the administrator. `from`/`to` select by start time (`from <= startedAt < to`), `running` by whether the timer is going.
      security:
        - bearerAuth: []
