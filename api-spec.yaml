openapi: 3.1.0
info:
  title: Hourly API
  version: 0.1.0
  description: |-
    A marketplace for freelance work with transparent time tracking. Hierarchy: project -> task -> work session, addressed as `/projects/{projectId}/tasks/{taskId}/sessions/{sessionId}`. A child requested under a parent it does not belong to answers 404. A known address used with an unsupported method answers 405 with an `Allow` header.

    **Hypermedia.** Every resource carries `_links`: related resources (`self`, `project`, `tasks`) and the actions the caller may take right now, with their method (`update`, `publish`, `stop`, `accept`...). Actions follow the role of the caller and the state of the resource. Lists add `first`, `prev`, `next` and `last`. Start at `GET /`.

    **Authentication.** `POST /auth/login` returns a short-lived access token (JWT) and sets the `hourly_refresh` cookie. Send the token as `Authorization: Bearer <token>` (the **Authorize** button). When it expires (401 `TOKEN_EXPIRED`), `POST /auth/refresh` issues a new one. After logout, a detected token replay or a password change on another device the token is refused with 401 `SESSION_REVOKED` - sign in again.
servers:
  - url: http://localhost:4000/api
    description: Local environment
tags:
  - name: Authentication
  - name: Projects
  - name: Tasks
  - name: Work sessions
  - name: Proposals
  - name: Share links
  - name: Users
  - name: Operations
paths:
  /:
    get:
      tags:
        - Operations
      summary: "Entry point: links to everything the caller can reach"
      description: "A client that knows only this address can discover the others by following `_links`. What is offered depends on the caller: a guest gets the marketplace and the way in, a signed-in user their own collections, the administrator the user list as well."
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Entry point
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  _links:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: object
                      properties:
                        href:
                          type: string
                          example: /api/projects/b0000000-0000-4000-8000-000000000001
                        method:
                          type: string
                          enum:
                            - POST
                            - PATCH
                            - DELETE
                      required:
                        - href
                      additionalProperties: false
                    description: "Hypermedia controls: related resources and the actions the caller may take now"
                required:
                  - name
                  - _links
                additionalProperties: false
              example:
                name: Hourly API
                _links:
                  self:
                    href: /api
                  marketplace:
                    href: /api/projects?scope=marketplace
                  docs:
                    href: /api/docs
                  openapi:
                    href: /api/openapi.json
                  register:
                    href: /api/auth/register
                    method: POST
                  login:
                    href: /api/auth/login
                    method: POST
  /health:
    get:
      tags:
        - Operations
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  uptime:
                    type: number
                required:
                  - status
                  - uptime
                additionalProperties: false
              example:
                status: ok
                uptime: 16.7575862
  /health/ready:
    get:
      tags:
        - Operations
      summary: "Readiness probe: the service and its database"
      description: Answers 503 when the database cannot be reached, so a load balancer or a deployment slot swap can wait for it.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: up
                required:
                  - status
                  - database
                additionalProperties: false
              example:
                status: ok
                database: up
        "503":
          description: The database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: degraded
                  database:
                    type: string
                    const: down
                required:
                  - status
                  - database
                additionalProperties: false
              example:
                status: degraded
                database: down
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register, choosing the client or specialist role
      description: "The administrator role cannot be chosen. The new user is signed in at once: the response carries the access token and sets the `hourly_refresh` cookie."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  example: naujas@hourly.lt
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: slaptazodis123
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                  example: Jonas Jonaitis
                role:
                  type: string
                  enum:
                    - CLIENT
                    - SPECIALIST
              required:
                - email
                - password
                - displayName
                - role
            example:
              email: demo-1793554501506@example.lt
              password: slaptazodis123
              displayName: Demonstracinis specialistas
              role: SPECIALIST
      responses:
        "201":
          description: Account created and signed in
          headers:
            Location:
              required: true
              description: Address of the new user
              schema:
                type: string
                description: Address of the new user
            Set-Cookie:
              required: true
              description: The refresh token (httpOnly)
              schema:
                type: string
                description: The refresh token (httpOnly)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      displayName:
                        type: string
                      role:
                        type: string
                        enum:
                          - CLIENT
                          - SPECIALIST
                          - ADMIN
                      bio:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        example: 2026-09-24T09:00:00.000Z
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                        example: specialistas@hourly.lt
                      isBlocked:
                        type: boolean
                    required:
                      - id
                      - displayName
                      - role
                      - bio
                      - createdAt
                      - email
                      - isBlocked
                    additionalProperties: false
                required:
                  - accessToken
                  - user
                additionalProperties: false
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiU1BFQ0lBTElTVCIsInNpZCI6IjYxOWEyNjgxLTExYTEtNDczNy05NWE0LWY5Zjk0NmFjZDg1MSIsImlhdCI6MTc5MzU1NDUwMiwiZXhwIjoxNzkzNTU1NDAyLCJhdWQiOiJob3VybHkiLCJpc3MiOiJob3VybHktYXBpIiwic3ViIjoiMTMyNTgwNTItZDE2ZC00MTEyLTgxM2QtMjUzZDQ1M2I3MmQ3In0.<signature>
                user:
                  id: 13258052-d16d-4112-813d-253d453b72d7
                  displayName: Demonstracinis specialistas
                  role: SPECIALIST
                  bio: null
                  createdAt: 2026-11-01T17:35:02.029Z
                  email: demo-1793554501506@example.lt
                  isBlocked: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: INVALID_PATH_PARAM
                  message: Invalid path parameter
                  details:
                    errors: []
                    properties:
                      projectId:
                        errors:
                          - Invalid UUID
        "409":
          description: An account with this e-mail already exists (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: EMAIL_TAKEN
                  message: An account with this e-mail already exists
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request payload
                  details:
                    errors: []
                    properties:
                      title:
                        errors:
                          - "Too small: expected string to have >=3 characters"
        "429":
          description: Too many attempts (TOO_MANY_REQUESTS); retry after `Retry-After` seconds
          headers:
            Retry-After:
              required: true
              description: Seconds until the limit resets
              schema:
                type: string
                description: Seconds until the limit resets
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
