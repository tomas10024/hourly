  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh the access token (token rotation)
      description: The refresh token is read from the `hourly_refresh` cookie only. Every refresh revokes the presented token and sets a new one, so each token works once. Presenting an already used token revokes every token of that login (REFRESH_TOKEN_REUSED).
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New tokens issued
          headers:
            Set-Cookie:
              required: true
              description: The next refresh token (httpOnly)
              schema:
                type: string
                description: The next refresh token (httpOnly)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      displayName:
                        type: string
                      role:
                        type: string
                        enum:
                          - CLIENT
                          - SPECIALIST
                          - ADMIN
                      bio:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        example: 2026-09-24T09:00:00.000Z
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                        example: specialistas@hourly.lt
                      isBlocked:
                        type: boolean
                    required:
                      - id
                      - displayName
                      - role
                      - bio
                      - createdAt
                      - email
                      - isBlocked
                    additionalProperties: false
                required:
                  - accessToken
                  - user
                additionalProperties: false
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiU1BFQ0lBTElTVCIsInNpZCI6IjYxOWEyNjgxLTExYTEtNDczNy05NWE0LWY5Zjk0NmFjZDg1MSIsImlhdCI6MTc5MzU1NDUwMiwiZXhwIjoxNzkzNTU1NDAyLCJhdWQiOiJob3VybHkiLCJpc3MiOiJob3VybHktYXBpIiwic3ViIjoiMTMyNTgwNTItZDE2ZC00MTEyLTgxM2QtMjUzZDQ1M2I3MmQ3In0.<signature>
                user:
                  id: 13258052-d16d-4112-813d-253d453b72d7
                  displayName: Demonstracinis specialistas
                  role: SPECIALIST
                  bio: null
                  createdAt: 2026-11-01T17:35:02.029Z
                  email: demo-1793554501506@example.lt
                  isBlocked: false
        "401":
          description: Missing, unknown or expired token (INVALID_REFRESH_TOKEN), or a reused one (REFRESH_TOKEN_REUSED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: REFRESH_TOKEN_REUSED
                  message: Refresh token was already used or revoked; sign in again
        "403":
          description: The account is blocked (ACCOUNT_BLOCKED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: ACCOUNT_BLOCKED
                  message: This account is blocked
        "429":
          description: Too many attempts (TOO_MANY_REQUESTS); retry after `Retry-After` seconds
          headers:
            Retry-After:
              required: true
              description: Seconds until the limit resets
              schema:
                type: string
                description: Seconds until the limit resets
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many attempts; try again later
                  details:
                    retryAfterSeconds: 900
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Sign out
      description: "Ends this login: revokes every refresh token of it and clears the cookie. The access tokens of the login stop working at once too - they name it in their `sid` claim, so the next request with one answers 401 SESSION_REVOKED. Works without an access token and without a cookie (idempotent)."
      security:
        - refreshCookie: []
        - {}
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Details of the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  displayName:
                    type: string
                  role:
                    type: string
                    enum:
                      - CLIENT
                      - SPECIALIST
                      - ADMIN
                  bio:
                    type:
                      - string
