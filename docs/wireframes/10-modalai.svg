<text x="40" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">PASTABOS</text>
<text x="40" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">1. Visi kūrimo / redagavimo veiksmai 3 objektams (projektas, užduotis, sesija) ir visi šalinimai – modaluose (&lt;dialog&gt;).</text>
<text x="40" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">2. &lt; 768px modalas užima visą ekraną (apatinis lapas).</text>
<text x="40" y="1166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">3. Įvedimo elementai: text, textarea, number, date, radio kortelės, switch, checkbox.</text>
<text x="40" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">4. Sėkmė / klaida – terminalo stiliaus pranešimas (toast); alert() / confirm() nenaudojami.</text>
</svg>