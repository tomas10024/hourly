<text x="40" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">PASTABOS</text>
<text x="40" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">1. Prisijungimas – tas pats maketas, tik el. paštas ir slaptažodis.</text>
<text x="40" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">2. Nuotrauka šone matoma tik ≥ 768px.</text>
<text x="40" y="1186" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">3. Įvedimo elementai: text, email, password, radio kortelės, checkbox.</text>
<text x="40" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">4. Klaidos (422, 409 „el. paštas užimtas“, 429 „bandykite po N min.“) – prie lauko arba virš mygtuko.</text>
