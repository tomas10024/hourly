<text x="40" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">PASTABOS</text>
<text x="40" y="1198" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">1. Mygtukas „Pateikti pasiūlymą“ rodomas tik jei atsakyme yra _links['submit-proposal'] (specialistas, projektas paskelbtas).</text>
<text x="40" y="1222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">2. Modalas: natūralus &lt;dialog&gt;; &lt; 768px – apatinis lapas per visą plotį.</text>
<text x="40" y="1246" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb">3. POST /projects/{id}/proposals; 409 – jau pateiktas pasiūlymas, 422 – klaidos prie laukų.</text>
